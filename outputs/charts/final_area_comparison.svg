<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
  <rect width="960" height="560" fill="white"/>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#222}.title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#555}.lab{font-size:15px}.val{font-size:14px;font-weight:700}.axis{stroke:#555;stroke-width:1}.grid{stroke:#ddd;stroke-width:1}.y{font-size:12px;fill:#666}
  </style>
  <text x="480" y="42" text-anchor="middle" class="title">Ibadan LULC Area Comparison, 2013–2023</text>
  <text x="480" y="68" text-anchor="middle" class="sub">Final frozen reconstruction · area in km²</text>
  <line x1="90" y1="460" x2="910" y2="460" class="axis"/>
  <line x1="90" y1="110" x2="90" y2="460" class="axis"/>
  <g>
    <line x1="90" y1="390" x2="910" y2="390" class="grid"/><text x="80" y="394" text-anchor="end" class="y">600</text>
    <line x1="90" y1="320" x2="910" y2="320" class="grid"/><text x="80" y="324" text-anchor="end" class="y">1,200</text>
    <line x1="90" y1="250" x2="910" y2="250" class="grid"/><text x="80" y="254" text-anchor="end" class="y">1,800</text>
    <line x1="90" y1="180" x2="910" y2="180" class="grid"/><text x="80" y="184" text-anchor="end" class="y">2,400</text>
    <line x1="90" y1="110" x2="910" y2="110" class="grid"/><text x="80" y="114" text-anchor="end" class="y">3,000</text>
  </g>
  <g>
    <rect x="145" y="448.4" width="34" height="11.6" fill="#999"/><rect x="184" y="421.5" width="34" height="38.5" fill="#d73027"/>
    <text x="181" y="493" text-anchor="middle" class="lab">Built-up</text><text x="162" y="441" text-anchor="middle" class="val">99.9</text><text x="201" y="414" text-anchor="middle" class="val">330.2</text>
    <rect x="345" y="97" width="34" height="363" fill="#999"/><rect x="384" y="123.8" width="34" height="336.2" fill="#4daf4a"/>
    <text x="381" y="493" text-anchor="middle" class="lab">Vegetation</text><text x="362" y="90" text-anchor="middle" class="val">3,112.2</text><text x="401" y="117" text-anchor="middle" class="val">2,881.9</text>
    <rect x="545" y="459.4" width="34" height="0.6" fill="#999"/><rect x="584" y="459.5" width="34" height="0.5" fill="#2c7fb8"/>
    <text x="581" y="493" text-anchor="middle" class="lab">Water</text><text x="562" y="449" text-anchor="middle" class="val">5.1</text><text x="601" y="432" text-anchor="middle" class="val">4.2</text>
    <rect x="745" y="459.6" width="34" height="0.4" fill="#999"/><rect x="784" y="459.5" width="34" height="0.5" fill="#d9a066"/>
    <text x="781" y="493" text-anchor="middle" class="lab">Bare soil</text><text x="762" y="449" text-anchor="middle" class="val">3.4</text><text x="801" y="432" text-anchor="middle" class="val">4.3</text>
  </g>
  <rect x="355" y="515" width="18" height="18" fill="#999"/><text x="380" y="529" class="lab">2013</text>
  <rect x="465" y="515" width="18" height="18" fill="#222"/><text x="490" y="529" class="lab">2023</text>
</svg>
